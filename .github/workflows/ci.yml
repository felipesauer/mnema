name: CI

on:
  push:
    # main is the published alpha and what dependabot works against; main-v1 is the trunk
    # the v1 is built on. Twelve merges landed on main-v1 before it was named here, and none
    # of them had ever run on a runner.
    branches: [main, main-v1]
  pull_request:
    branches: [main, main-v1]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + build + test (node ${{ matrix.node }})
    # Pinned rather than `ubuntu-latest`. Not because the next image breaks the suite — the
    # primitives `tests/support/pty.ts` needs (`script -qec`, `stty -F`) were checked on
    # util-linux 2.39.3 and 2.41.3 and behave identically on both. It is pinned because a
    # repository that stamps the build behind every measurement cell should not let the image
    # under the runner change without anybody deciding it. Moving to 26.04 is a one-line diff.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor comes from `engines.node`, and `the-runtime-floor-is-declared-once` fails
        # if this list stops covering it. 24 is what development runs on: a CI that never runs
        # the runtime the code is written on is not checking what is being written.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # WHAT THE SUITE LEAVES IN /tmp, half one. 187 prefixes are built under `tmpdir()` by this
      # workspace and exactly one of them is watched by a test, because the obvious watch — list
      # the directory before and after — is a race inside a suite that runs several files at once.
      # It is not a race here: nothing of ours is running at this point in the job, so what appears
      # between this listing and the one after the last vitest step is what the run left.
      - name: What the suite left behind (before)
        run: pnpm what-the-suite-left-behind --record

      # The JSON report is kept because it carries a duration per case, and durations off the
      # runner are the one thing no workstation and no container can supply. It ANSWERED, once,
      # the question `the-ceiling-belongs-to-the-case` names as beyond a source scan — whether
      # any case is near the ceiling it shares. It is no longer the only thing that does: `pnpm
      # test` now also leaves the ledger the step below reads, which carries the ceiling each
      # case ran under as well as its duration, and answers that question on every run instead
      # of on the day somebody downloads this artifact and reads it by hand.
      - name: Test
        run: pnpm test --reporter=json --outputFile.json=vitest-report.json

      # WHY IT WENT RED, AND ONLY WHEN IT DID. `pnpm test` leaves a ledger behind — a duration,
      # the ceiling each case actually ran under, and what the machine was doing in that case's
      # own window. This reads it and RE-RUNS every red on its own, so the page says which reds
      # reproduce alone (the guard catching something) and which do not. Two deliveries had to
      # discount reds by hand as machine contention before this existed.
      #
      # It cannot turn a red green: the step above has already failed by the time this runs, and
      # this one is `continue-on-error` so that a broken ruler here never masks the red it was
      # asked to explain.
      - name: Why it went red
        if: failure()
        continue-on-error: true
        run: pnpm why-it-went-red --summary "$GITHUB_STEP_SUMMARY" --json why-it-went-red-verdict.json

      - name: Upload the verdict
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: why-it-went-red-node${{ matrix.node }}
          path: |
            why-it-went-red.json
            why-it-went-red-verdict.json
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report-node${{ matrix.node }}
          path: vitest-report.json
          if-no-files-found: warn

      # This step now has a gate in it — `thresholds` in `vitest.config.ts`, floored to today's
      # figures. It stays a SECOND run of the suite rather than replacing the first, and the
      # measurement is why: v8 instrumentation costs 1.48x on the slowest case that shares the
      # five-second ceiling (2412 ms against 1635 ms) while costing only 11.6% of wall clock.
      # Folding the two steps together would save around two minutes of runner time and spend a
      # third of that ceiling's headroom to buy it. Keeping them apart also means the matrix runs
      # the suite both instrumented (here) and plain (node 24), which is worth more than the two
      # minutes.
      - name: Coverage gate
        if: matrix.node == '22'
        run: pnpm test:coverage

      # …and half two, which is why it sits at the END of the job rather than beside the test
      # step: the coverage gate above is a SECOND run of the suite, and a sweep taken between the
      # two would read a /tmp the second run is about to write. It refuses outright if any vitest
      # is still alive, so an ordering mistake here reports `RULER BROKEN` rather than a wrong
      # answer — and `continue-on-error`, because a leaked directory is worth a red build no more
      # than a broken ruler is worth masking the reds above it.
      - name: What the suite left behind (after)
        if: always()
        continue-on-error: true
        run: pnpm what-the-suite-left-behind --summary "$GITHUB_STEP_SUMMARY" --json what-the-suite-left-behind-verdict.json

      - name: Upload what the suite left behind
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: what-the-suite-left-behind-node${{ matrix.node }}
          path: what-the-suite-left-behind-verdict.json
          if-no-files-found: ignore
