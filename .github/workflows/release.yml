name: Release

# PUBLISHES THE FIVE PACKAGES TO NPM AND ONLY THEN CUTS THE TAG AND THE RELEASE. A person approves it
# in the `npm` environment (its required reviewer is set in the repository's Settings, not here);
# the publish itself holds no token and no secret: npm trusts this workflow through OIDC (the
# trusted publisher of each package names this repository, `release.yml` and the `npm` environment)
# and signs a provenance statement with every package.
#
# WHEN. On a push to `main`, and by hand with `mode`:
#   publish   publish what the root version names, if npm does not have it yet (the default);
#   tag-only  publish nothing: check that the five packages on npm carry the root version, then
#             create the tag and the release. It exists for a version published by hand, as the
#             first one was (a package that was not on npm yet had no trusted publisher to be trusted by).
# A push whose root version is the one npm already serves does nothing. A push while `@mnema/code`
# is not on npm at all does not publish either: it says the first publication is by hand, and ends
# green.
#
# WHAT IS PUBLISHED IS WHAT WAS TESTED. One job without `id-token` installs, builds and packs the five and
# uploads the tarballs and exposes their SHA-256 as outputs; the packed install installs those very files on the
# three Nodes; the publish downloads them, checks them against those outputs (not against a file that travels
# with them) and publishes them. It installs nothing and builds
# nothing, so no code of the repository or of its dependencies runs while the job can ask for the OIDC token.
# The tag and the release also ask for the `npm` environment, in both ways to reach them: nothing is
# tagged or released without the approval.
#
# THE ORDER. chain, core, context, stacks, code: a package is published after the ones it depends
# on. A package already at the version is skipped, so a run that stopped halfway runs again.
# The tag and the release come after the publish, and only if the five are on npm at the version.
#
# WHAT IT DOES NOT PROVE. Its publish has run (0.1.1 was the first version it published; 0.1.0 was published by hand), so
# that is no longer untried, and a run does not prove the next one. It needs no npm token and
# no secret for the packages; the release is created with the job's own `github.token`.
#
# THE EXTENSION. After the release, the VS Code extension is packed once without a secret, checked, installed
# into a real VS Code, attached to the release and published, the same file, to the Visual Studio Marketplace
# and to Open VSX by a job that a person approves in the `extension-stores` environment. That job is the only
# place in the repository that holds a store token (the two secrets of that environment),
# and `no-workflow-publishes-the-extension.test.ts` fails if a token or a publish command is anywhere else.
# A push whose version npm already serves does nothing, the extension included: to put the extension of such
# a version in the stores, run the jobs of the run that published it again. Nothing here has run yet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish: publish what the root version names. tag-only: only tag and release what npm already has.'
        type: choice
        options: [publish, tag-only]
        default: publish

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: what is to be done
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the root version with the one npm serves
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::release runs on main only, not on $REF"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "tag-only" ]; then
            echo "action=tag-only" >> "$GITHUB_OUTPUT"
            echo "tag-only: $version"
            exit 0
          fi

          if published="$(npm view @mnema/code version 2>"$RUNNER_TEMP/npm-view.err")"; then
            :
          elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            echo "action=first-by-hand" >> "$GITHUB_OUTPUT"
            echo "::notice::@mnema/code is not on npm yet: the first publication is made by hand, so nothing is published here."
            exit 0
          else
            cat "$RUNNER_TEMP/npm-view.err"
            exit 1
          fi

          if [ "$published" = "$version" ]; then
            echo "action=nothing" >> "$GITHUB_OUTPUT"
            echo "npm already serves $version: nothing to publish."
          else
            echo "action=publish" >> "$GITHUB_OUTPUT"
            echo "npm serves $published, the root says $version: publish."
          fi

  pack:
    name: build and pack the five
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256-chain: ${{ steps.pack.outputs.chain }}
      sha256-core: ${{ steps.pack.outputs.core }}
      sha256-context: ${{ steps.pack.outputs.context }}
      sha256-stacks: ${{ steps.pack.outputs.stacks }}
      sha256-code: ${{ steps.pack.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack the five and write their SHA-256
        id: pack
        run: |
          set -euo pipefail
          tarballs="$RUNNER_TEMP/tarballs"
          mkdir "$tarballs"
          for p in chain core context stacks code; do
            (cd "packages/$p" && pnpm pack --pack-destination "$tarballs" >/dev/null)
          done
          (cd "$tarballs" && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS)
          for p in chain core context stacks code; do
            echo "$p=$(sha256sum "$tarballs"/mnema-$p-*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error

  packed-install:
    name: packed install (node ${{ matrix.node }})
    needs: [plan, pack]
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        node: ['24.15.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Check the SHA-256 of what was packed
        run: (cd "$RUNNER_TEMP/tarballs" && sha256sum --check SHA256SUMS)

      - name: Install the very tarballs that will be published
        run: bash .github/the-packed-install/run.sh "$RUNNER_TEMP/tarballs"

  publish:
    name: publish the five to npm
    needs: [plan, pack, packed-install]
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Trusted publishing needs npm 11.5.1 or newer. The npm that setup-node brings is not replaced: this
      # only reads it, so no code from the registry runs while the job can ask for the OIDC token.
      - name: Check that the npm can publish by OIDC
        run: |
          have="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have is older than 11.5.1, which publishing through OIDC needs"
            exit 1
          fi
          echo "npm $have can publish by OIDC."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Publish the tarballs that were tested, in dependency order
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA256_CHAIN: ${{ needs.pack.outputs.sha256-chain }}
          SHA256_CORE: ${{ needs.pack.outputs.sha256-core }}
          SHA256_CONTEXT: ${{ needs.pack.outputs.sha256-context }}
          SHA256_STACKS: ${{ needs.pack.outputs.sha256-stacks }}
          SHA256_CODE: ${{ needs.pack.outputs.sha256-code }}
        run: |
          set -euo pipefail
          tarballs="$RUNNER_TEMP/tarballs"
          for p in chain core context stacks code; do
            want="SHA256_${p^^}"
            want="${!want}"
            have="$(sha256sum "$tarballs/mnema-$p-$VERSION.tgz" | cut -d' ' -f1)"
            [ -n "$want" ] && [ "$have" = "$want" ] || { echo "::error::mnema-$p-$VERSION.tgz is not the file the pack job made"; exit 1; }
          done
          for p in chain core context stacks code; do
            if [ "$(npm view "@mnema/$p@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "@mnema/$p@$VERSION is already on npm: skipped."
              continue
            fi
            npm publish "$tarballs/mnema-$p-$VERSION.tgz" --provenance --access public
          done

  release:
    name: tag and release what npm serves
    needs: [plan, publish]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.plan.outputs.action == 'tag-only') }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait until npm serves the five at the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tries=20
          pause=30
          for attempt in $(seq 1 "$tries"); do
            missing=""
            for p in chain core context stacks code; do
              served="$(npm view "@mnema/$p@$VERSION" version 2>/dev/null || true)"
              [ "$served" = "$VERSION" ] || missing="$missing @mnema/$p"
            done
            if [ -z "$missing" ]; then
              echo "All five are on npm at $VERSION."
              exit 0
            fi
            echo "Attempt $attempt of $tries: npm does not serve$missing at $VERSION yet."
            [ "$attempt" -lt "$tries" ] && sleep "$pause"
          done
          echo "::error::$missing at $VERSION is not on npm after $((tries * pause / 60)) minutes"
          exit 1

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already has a release: nothing to do."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v h="## [$VERSION]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\nnpm: https://www.npmjs.com/package/@mnema/code/v/%s\n' "$VERSION" >> "$notes"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$notes"

  # THE EXTENSION AS A FILE, WITHOUT A SECRET. The same `.vsix` goes to the GitHub release, to the Visual
  # Studio Marketplace and to Open VSX, so it is packed once, here, in a job that holds no token and no
  # write permission: it builds, packs, checks that the file is what a store takes
  # (`packages/vscode/build/check-the-vsix.mjs`), installs that very file into a real VS Code to see the
  # extension start, and exposes its SHA-256 as an output. It runs only after the tag and the release exist,
  # which is after a person approved the `npm` environment.
  vsix:
    name: pack the extension
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack the extension, check the file and write its SHA-256
        id: pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --filter @mnema/vscode package
          vsix="packages/vscode/mnema-$VERSION.vsix"
          [ -f "$vsix" ] || { echo "::error::$vsix was not made: the extension's version is not $VERSION"; exit 1; }
          node packages/vscode/build/check-the-vsix.mjs "$vsix"
          mkdir "$RUNNER_TEMP/vsix"
          cp "$vsix" "$RUNNER_TEMP/vsix/"
          echo "sha256=$(sha256sum "$vsix" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Install that file in VS Code and check that it starts
        run: xvfb-run -a pnpm --filter @mnema/vscode install-check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
          if-no-files-found: error

  # THE FILE ON THE RELEASE. It writes to the release and nothing else, installs nothing and builds nothing.
  attach-vsix:
    name: attach the extension to the release
    needs: [plan, vsix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Attach the file the pack job made, if the release does not hold it yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA256: ${{ needs.vsix.outputs.sha256 }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/vsix/mnema-$VERSION.vsix"
          have="$(sha256sum "$file" | cut -d' ' -f1)"
          [ -n "$SHA256" ] && [ "$have" = "$SHA256" ] || { echo "::error::$file is not the file the pack job made"; exit 1; }
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx "mnema-$VERSION.vsix"; then
            echo "v$VERSION already holds mnema-$VERSION.vsix: skipped."
            exit 0
          fi
          gh release upload "v$VERSION" "$file"

  # THE EXTENSION IN THE TWO STORES. The only job of any workflow that holds a store token, and a person
  # approves it in the `extension-stores` environment (its required reviewer and its branch policy, `main`, are
  # set in the repository's Settings, not here); the secrets `VSCE_PAT` and `OVSX_PAT` belong to that environment.
  # It builds nothing and runs no install script. It downloads the file the pack job made and checks it against
  # the SHA-256 that job exposed (not against a file that travels with it). The two store command lines are
  # installed from `.github/release-tools`, a committed lockfile with the integrity of every package, by
  # `npm ci --ignore-scripts` in a step that holds no secret; the steps that hold a token call the installed
  # binaries by path, so nothing is resolved from the registry and no install script runs while a token is in
  # the environment. Each store is published to in a step of its own with only its own token, and with
  # `--skip-duplicate`, so a run that stopped halfway runs again; the question to each store of whether it has
  # the version is only logged (the Marketplace's answer leaves out a version still in validation).
  publish-vsix:
    name: publish the extension to the stores
    needs: [plan, vsix]
    runs-on: ubuntu-24.04
    environment: extension-stores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode: this folder and the files at the root are written, nothing else. The install below
          # reads only this folder's package.json and lockfile (`--prefix`), not the root's `.npmrc`.
          sparse-checkout: .github/release-tools

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the two store command lines from the lockfile, with no install script and no secret
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release-tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Check the file against the hash the pack job exposes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA256: ${{ needs.vsix.outputs.sha256 }}
        run: |
          set -euo pipefail
          have="$(sha256sum "$RUNNER_TEMP/vsix/mnema-$VERSION.vsix" | cut -d' ' -f1)"
          [ -n "$SHA256" ] && [ "$have" = "$SHA256" ] || { echo "::error::mnema-$VERSION.vsix is not the file the pack job made"; exit 1; }

      - name: Publish to the Visual Studio Marketplace
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          served="$(curl -sS -X POST 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
            -H 'Accept: application/json;api-version=3.0-preview.1' -H 'Content-Type: application/json' \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"mnema.mnema"}]}],"flags":103}' \
            | node -e 'const j = JSON.parse(require("fs").readFileSync(0, "utf8")); const e = j.results[0].extensions[0]; console.log(e ? e.versions.map((v) => v.version).join(" ") : "")' || true)"
          echo "The Marketplace serves: ${served:-nothing}"
          "$GITHUB_WORKSPACE/.github/release-tools/node_modules/.bin/vsce" publish --skip-duplicate --packagePath "$RUNNER_TEMP/vsix/mnema-$VERSION.vsix"

      - name: Publish to Open VSX
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          echo "Open VSX answers $(curl -sS -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/mnema/mnema/$VERSION" || true) for mnema.mnema@$VERSION (200 means it has it)"
          "$GITHUB_WORKSPACE/.github/release-tools/node_modules/.bin/ovsx" publish --skip-duplicate "$RUNNER_TEMP/vsix/mnema-$VERSION.vsix"
